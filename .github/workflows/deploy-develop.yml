name: Deploy Develop Preview

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: 'docs/requirements.txt'

      - name: Install dependencies
        run: uv venv && uv pip install -r docs/requirements.txt

      - name: Build develop preview
        run: uv run python scripts/build_pr_preview.py develop /tmp/site

      - name: Deploy to gh-pages pr-preview/develop
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site
          destination_dir: pr-preview/develop
          keep_files: true
