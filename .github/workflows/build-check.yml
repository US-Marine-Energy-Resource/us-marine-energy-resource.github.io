name: Docs Build Check

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'hooks/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: 'docs/requirements.txt'

      - name: Install dependencies
        run: uv venv && uv pip install -r docs/requirements.txt

      - name: Build docs
        run: uv run mkdocs build --strict --site-dir /tmp/site
