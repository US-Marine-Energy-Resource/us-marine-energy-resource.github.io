site_name: U.S. Marine Energy Resource
site_url: https://us-marine-energy-resource.github.io/
site_description: United States marine energy resource characterization research sponsored by the U.S. Department of Energy Hydropower and Hydrokinetic Office (H2O)
# repo_url: https://github.com/US-Marine-Energy-Resource/us-marine-energy-resource.github.io
repo_name: US-Marine-Energy-Resource/us-marine-energy-resource.github.io

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Figtree
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    # - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - navigation.footer
    - announce.dismiss
  favicon: assets/images/favicon.svg
  icon:
    logo: material/water
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

nav:
  - Home:
    - index.md
    - U.S. Marine Energy Potential By Region: us-marine-energy-potential-by-region.md
    - Types of Marine Energy Conversion: types-of-marine-energy-conversion.md
    - Resource Characterization: resource-characterization.md
    - Data Access: data-access.md
    - Contact: contact.md
    # About pages not yet committed
    # - About:
    #   - Project: about/project.md
    #   - Funding: about/funding.md
    #   - Contact: about/contact.md
  # Getting Started section not yet committed
  # - Getting Started:
  #   - getting-started/index.md
  #   - Accessing Data:
  #     - HSDS Setup: getting-started/hsds-setup.md
  #     - AWS S3 Downloads: getting-started/aws-s3.md
  #     - Marine Energy Atlas: getting-started/marine-energy-atlas.md
  #   - Data Formats: getting-started/data-formats.md
  #   - Contributing: getting-started/contributing.md
  - Wave:
    - wave/index.md
    - Hindcast:
      - wave/hindcast/index.md
      - Variables: wave/hindcast/variables.md
      - References: wave/hindcast/references.md
  - Tidal:
    - tidal/index.md
    - High Resolution Hindcast:
      - tidal/high-resolution-hindcast/index.md
      - Model:
        - FVCOM Configuration: tidal/high-resolution-hindcast/model-configuration.md
        - Sigma Layers: tidal/high-resolution-hindcast/sigma-layers.md
        - Unstructured Grid: tidal/high-resolution-hindcast/unstructured-grid.md
        - Limitations: tidal/high-resolution-hindcast/limitations.md
      - Regional Coverage: tidal/high-resolution-hindcast/coverage-maps.md
      - FAQ: tidal/high-resolution-hindcast/faq.md
      - Atlas Variables:
        - tidal/high-resolution-hindcast/variables.md
        - Mean Current Speed: tidal/high-resolution-hindcast/mean-current-speed.md
        - 95th Percentile Current Speed: tidal/high-resolution-hindcast/95th-percentile-current-speed.md
        - Mean Power Density: tidal/high-resolution-hindcast/mean-power-density.md
        - 95th Percentile Power Density: tidal/high-resolution-hindcast/95th-percentile-power-density.md
        - Minimum Water Depth: tidal/high-resolution-hindcast/minimum-water-depth.md
        - Maximum Water Depth: tidal/high-resolution-hindcast/maximum-water-depth.md
        - Grid Resolution: tidal/high-resolution-hindcast/grid-resolution.md
        - Tidal Range: tidal/high-resolution-hindcast/tidal-range.md
        - Distance to Shore: tidal/high-resolution-hindcast/distance-to-shore.md
        - High Tide Max Elevation: tidal/high-resolution-hindcast/max-sea-surface-elevation-at-high-tide.md
        - Low Tide Min Elevation: tidal/high-resolution-hindcast/min-sea-surface-elevation-at-low-tide.md
        - Center Latitude: tidal/high-resolution-hindcast/center_latitude.md
        - Center Longitude: tidal/high-resolution-hindcast/center_longitude.md
        - Face Id: tidal/high-resolution-hindcast/face_id.md
        - Full Year HTTPS URL: tidal/high-resolution-hindcast/full_year_https_url.md
        - Full Year S3 URL: tidal/high-resolution-hindcast/full_year_s3_uri.md
      - Time Series Variables: tidal/high-resolution-hindcast/time-series-variables.md
      - Methodology: tidal/high-resolution-hindcast/methodology.md
      # - Validation: tidal/high-resolution-hindcast/validation.md
      - Data Access: tidal/high-resolution-hindcast/data-access.md
      # - Usage Examples: tidal/high-resolution-hindcast/usage-examples.md
      # - Quality Assurance: tidal/high-resolution-hindcast/quality-assurance.md
      - Coordinate Systems: tidal/high-resolution-hindcast/coordinate-systems.md
      - Definitions: tidal/high-resolution-hindcast/definitions.md
      # - Changelog: tidal/high-resolution-hindcast/changelog.md
      - References: tidal/high-resolution-hindcast/references.md
  - OTEC:
    - otec/index.md
  - Ocean Current:
    - ocean-current/index.md
  - River:
    - river/index.md
  - Conferences:
    - conferences/index.md
    - UMERC 2026: conferences/umerc-2026.md
  - About:
    - about/project.md
    - about/team.md
    - about/funding.md
    - Contact: about/contact.md

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      title: On this page
  - attr_list
  - md_in_html
  - def_list

extra_javascript:
  - javascripts/notice.js
  - javascripts/navpane.js
  - javascripts/toc-fix.js
  - javascripts/glightbox-init.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/citation.min.js
  - javascripts/cite.js

extra:
  homepage: /
  social:
    - icon: material/water
      link: https://github.com/US-Marine-Energy-Resource/documentation
  generator: false

hooks:
  - hooks/validate_references.py
  - hooks/generate_tidal_plots.py
  - hooks/generate_cli_docs.py
  - hooks/extract_readme_sections.py

copyright: Copyright &copy; 2026 Alliance for Energy Innovation, LLC
